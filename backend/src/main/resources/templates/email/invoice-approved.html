<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/><title>Invoice Approved</title>
<style>
  body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f9ff;margin:0;padding:0;}
  .wrapper{max-width:600px;margin:32px auto;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.08);}
  .header{background:linear-gradient(135deg,#2563eb,#1d4ed8);padding:28px 32px;color:#fff;}
  .body{padding:32px;}
  .amount{font-size:42px;font-weight:800;color:#2563eb;text-align:center;margin:16px 0;}
  .info-box{background:#eff6ff;border-left:4px solid #2563eb;padding:16px 20px;border-radius:0 8px 8px 0;margin:20px 0;}
  .cta{display:block;width:fit-content;margin:24px auto;padding:12px 32px;background:#2563eb;color:#fff !important;border-radius:8px;text-decoration:none;font-weight:700;}
  .footer{background:#f9fafb;padding:20px 32px;font-size:12px;color:#9ca3af;text-align:center;}
</style>
</head>
<body>
<div class="wrapper">
  <div class="header"><h1>✅ Invoice Approved &amp; Issued</h1></div>
  <div class="body">
    <p>Your invoice has been reviewed, approved, and is now officially issued.</p>
    <div class="amount" th:text="'₹' + ${amount}">₹0.00</div>
    <div class="info-box">
      <p><strong>Invoice ID:</strong> <span th:text="${invoiceId}">—</span></p>
      <p><strong>Amount Due:</strong> ₹<span th:text="${amount}">0.00</span></p>
      <p><strong>Status:</strong> ISSUED</p>
    </div>
    <a href="#" class="cta">View Invoice</a>
  </div>
  <div class="footer">Lab Resource Management System &bull; Automated notification. Do not reply.</div>
</div>
</body>
</html>
