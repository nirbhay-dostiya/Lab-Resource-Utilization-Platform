spring.application.name=Lab-Resource-Utilization
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/LabResourceDB}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASS:Nirbhay}
server.port=${PORT:8080}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# ── Spring Mail (Module 6) — configure via environment variables in prod ──
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:noreply@labresource.io}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.test-connection=false

# ── Async Thread Pool (Module 5 – Report Worker) ──
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=report-worker-

# ── Facility host institution name (for inter-institutional billing) ──
app.facility.host-institution-name=${HOST_INSTITUTION_NAME:SBMTECH University}